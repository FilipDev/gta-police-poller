name: waze-gta-poll
on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: waze-gta-poll
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore Waze account state
        uses: actions/cache@v4
        with:
          path: data/rt_state.json
          key: rt-state-${{ github.run_id }}
          restore-keys: |
            rt-state-
      - name: Poll Waze and push to the live map
        env:
          POLL_KEY: ${{ secrets.POLL_KEY }}
        run: python3 ci_poll.py
      - name: Heartbeat commit (keeps the schedule active)
        if: success()
        run: |
          git config user.name "gta-police-poller"
          git config user.email "actions@users.noreply.github.com"
          git add STATUS.md
          git commit -m "poll ok" || exit 0
          git push
